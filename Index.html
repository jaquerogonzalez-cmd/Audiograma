<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiograma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#1d2b36;--mut:#5d6f7c;--line:#d3dce3;--acc:#1f7a8c;--od:#c0392b;--oi:#2f6fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--panel:#1b262e;--ink:#e6edf2;--mut:#9fb0bc;--line:#2f3f4a;--acc:#4fb3c6}}
:root[data-theme="dark"]{--bg:#121a20;--panel:#1b262e;--ink:#e6edf2;--mut:#9fb0bc;--line:#2f3f4a;--acc:#4fb3c6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.45}
main{max-width:1080px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.meta{display:grid;grid-template-columns:1fr 64px 140px;gap:8px;margin-bottom:16px}
label{font-size:.85rem;color:var(--mut);display:block;margin-bottom:3px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
table{width:100%;border-collapse:collapse}
th{font-size:.8rem;font-weight:700;padding:2px 3px 6px;text-align:center}
th.od{color:var(--od)}th.oi{color:var(--oi)}
td{padding:3px;text-align:center;position:relative}
td:first-child{font-weight:700;text-align:left;padding-right:6px}
td input{text-align:center;padding:6px 2px}
.grp th{border-bottom:1px solid var(--line);font-size:.9rem}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:520px){.avg{grid-template-columns:1fr}}
.avg div{border:1px solid var(--line);border-radius:8px;padding:10px}
.avg b{display:block;font-size:.85rem;margin-bottom:6px}
.avg p{margin:2px 0;display:flex;justify-content:space-between}
.avg .v{font-weight:700}
.chartbox{background:#fff;border-radius:8px;border:1px solid var(--line);padding:4px}
svg{width:100%;height:auto;display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
button{font:inherit;font-weight:700;border-radius:8px;padding:9px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.obs{margin-top:16px}
.pr{display:none}
.mk-sw{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.9rem}
.mk-sw input{width:auto}
.m{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;font-size:.7rem;border-radius:4px;background:transparent;color:var(--mut);border:1px solid var(--line)}
.mk .m{display:inline-block}
.n{display:none;position:absolute;left:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;font-size:.85rem;line-height:1;border-radius:4px;background:transparent;color:var(--mut);border:1px solid var(--line)}
.nr .n{display:inline-block}
.nr td input{padding-left:22px}
.n[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.by{text-align:center;color:var(--mut);font-size:.85rem;padding:0 14px 28px}
.mk td input{padding-right:22px}
.m[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
@media print{
 body{background:#fff;color:#000}
 .noprint,.btns{display:none!important}
 .grid{grid-template-columns:1fr}
 .card{border:0;padding:0}
 .pr{display:block}
 #entry{display:none}
}
</style>
</head>
<body>
<main>
 <h1>Audiograma</h1>
 <p class="sub noprint">Ingresa los umbrales en dB HL. Las casillas vacías no se grafican.</p>
 <div class="grid">
  <section class="card" id="entry">
   <h2>Datos</h2>
   <div class="meta">
    <div><label for="nom">Nombre</label><input id="nom" autocomplete="off"></div>
    <div><label for="edad">Edad</label><input id="edad" type="number" inputmode="numeric" min="0" max="120"></div>
    <div><label for="fec">Fecha</label><input id="fec" type="date"></div>
   </div>
   <label class="mk-sw"><input type="checkbox" id="mk"> Marcar enmascaramiento</label>
   <label class="mk-sw"><input type="checkbox" id="nr"> Marcar sin respuesta</label>
   <table>
    <thead>
     <tr class="grp"><th></th><th colspan="2">Vía aérea</th><th colspan="2">Vía ósea</th></tr>
     <tr><th>Hz</th><th class="od">OD</th><th class="oi">OI</th><th class="od">OD</th><th class="oi">OI</th></tr>
    </thead>
    <tbody id="rows"></tbody>
   </table>
  </section>
  <section>
   <div class="card">
    <h2>Gráfico</h2>
    <div class="chartbox" id="chart"></div>
    <div class="btns">
     <button id="png">Descargar imagen</button>
     <button id="prt" class="ghost">Imprimir / guardar PDF</button>
     <button id="clr" class="ghost">Borrar todo</button>
    </div>
    <div class="avg">
     <div><b>PPT 500 - 1000 - 2000 Hz</b>
      <p><span>OD</span><span class="v" id="a1od">—</span></p><p><span>OI</span><span class="v" id="a1oi">—</span></p></div>
     <div><b>PPT 500 - 1000 - 2000 - 4000 Hz</b>
      <p><span>OD</span><span class="v" id="a2od">—</span></p><p><span>OI</span><span class="v" id="a2oi">—</span></p></div>
    </div>
    <div class="obs"><label for="obs">Observaciones</label><textarea id="obs" placeholder="Ej.: hallazgos, comportamiento del paciente."></textarea></div>
   </div>
  </section>
 </div>
</main>
<footer class="by">By Rodrigo Jaque TM ORL</footer>
<script>
const F=[125,250,500,1000,2000,3000,4000,6000,8000];
const K=['aod','aoi','bod','boi'];
const D={aod:[],aoi:[],bod:[],boi:[]};
const OD='#c0392b',OI='#2f6fa8';
const rows=document.getElementById('rows');
F.forEach((f,i)=>{
 const tr=document.createElement('tr');
 tr.innerHTML='<td>'+f+'</td>'+K.map(k=>'<td><button type="button" class="n" data-k="'+k+'" data-i="'+i+'" aria-pressed="false" aria-label="Sin respuesta">↓</button><input type="number" inputmode="numeric" step="5" min="-10" max="120" data-k="'+k+'" data-i="'+i+'" aria-label="'+k.toUpperCase()+' '+f+' Hz"><button type="button" class="m" data-k="'+k+'" data-i="'+i+'" aria-pressed="false" aria-label="Enmascarado">M</button></td>').join('');
 rows.appendChild(tr);
});
rows.addEventListener('input',e=>{
 const t=e.target;if(!t.dataset.k)return;
 const v=parseFloat(t.value);
 D[t.dataset.k][+t.dataset.i]=isNaN(v)?null:Math.max(-10,Math.min(120,v));
 draw();
});
const M={aod:[],aoi:[],bod:[],boi:[]},N={aod:[],aoi:[],bod:[],boi:[]};
rows.addEventListener('click',e=>{const b=e.target.closest('.m,.n');if(!b)return;const S=b.classList.contains('n')?N:M;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);S[b.dataset.k][+b.dataset.i]=on;draw();});
document.getElementById('mk').addEventListener('change',e=>{document.body.classList.toggle('mk',e.target.checked);draw();});
document.getElementById('nr').addEventListener('change',e=>{document.body.classList.toggle('nr',e.target.checked);draw();});
['nom','edad','fec'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
const X0=64,X1=600,Y0=56,Y1=380;
const px=i=>X0+(X1-X0)*i/(F.length-1);
const py=d=>Y0+(d+10)/130*(Y1-Y0);
function arrow(k,x,y){const e=k.endsWith('d')?-1:1,c=e<0?OD:OI;return '<line x1="'+(x+e*5)+'" y1="'+(y+9)+'" x2="'+(x+e*11)+'" y2="'+(y+25)+'" stroke="'+c+'" stroke-width="2" marker-end="url(#'+(e<0?'ahD':'ahI')+')"/>';}
function msym(k,x,y){
 if(k==='aod')return '<path d="M'+x+' '+(y-8)+'L'+(x-8)+' '+(y+6)+'L'+(x+8)+' '+(y+6)+'Z" fill="none" stroke="'+OD+'" stroke-width="2.4"/>';
 if(k==='aoi')return '<rect x="'+(x-6)+'" y="'+(y-6)+'" width="12" height="12" fill="none" stroke="'+OI+'" stroke-width="2.4"/>';
 if(k==='bod')return '<path d="M'+(x+2)+' '+(y-7)+'L'+(x-4)+' '+(y-7)+'L'+(x-4)+' '+(y+7)+'L'+(x+2)+' '+(y+7)+'" stroke="'+OD+'" stroke-width="2.6" fill="none"/>';
 return '<path d="M'+(x-2)+' '+(y-7)+'L'+(x+4)+' '+(y-7)+'L'+(x+4)+' '+(y+7)+'L'+(x-2)+' '+(y+7)+'" stroke="'+OI+'" stroke-width="2.6" fill="none"/>';
}
function sym(k,x,y,m){if(m)return msym(k,x,y);
 if(k==='aod')return '<circle cx="'+x+'" cy="'+y+'" r="7" fill="none" stroke="'+OD+'" stroke-width="2.4"/>';
 if(k==='aoi')return '<path d="M'+(x-6)+' '+(y-6)+'L'+(x+6)+' '+(y+6)+'M'+(x+6)+' '+(y-6)+'L'+(x-6)+' '+(y+6)+'" stroke="'+OI+'" stroke-width="2.6" fill="none"/>';
 if(k==='bod')return '<path d="M'+(x+3)+' '+(y-7)+'L'+(x-5)+' '+y+'L'+(x+3)+' '+(y+7)+'" stroke="'+OD+'" stroke-width="2.6" fill="none"/>';
 return '<path d="M'+(x-3)+' '+(y-7)+'L'+(x+5)+' '+y+'L'+(x-3)+' '+(y+7)+'" stroke="'+OI+'" stroke-width="2.6" fill="none"/>';
}
function fmt(n){return n.toFixed(2)}
function avg(k,idx){
 const v=idx.map(i=>D[k][i]);
 return v.some(x=>x==null||x===undefined)?'—':fmt(v.reduce((a,b)=>a+b,0)/v.length)+' dB';
}
function draw(){
 let s='<svg id="svg" viewBox="0 0 640 490" xmlns="http://www.w3.org/2000/svg" font-family="Atkinson Hyperlegible, Arial, sans-serif">';
 s+='<defs><marker id="ahD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+OD+'"/></marker><marker id="ahI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+OI+'"/></marker></defs>';
 s+='<rect width="640" height="490" fill="#fff"/>';
 const nom=document.getElementById('nom').value,fec=document.getElementById('fec').value,edad=document.getElementById('edad').value;
 s+='<text x="64" y="26" font-size="15" font-weight="700" fill="#1d2b36">'+esc(nom||'Audiograma')+'</text>';
 const der=[edad?'Edad: '+edad+' años':'',fec].filter(Boolean).join('   |   ');
 if(der)s+='<text x="600" y="26" font-size="13" text-anchor="end" fill="#5d6f7c">'+esc(der)+'</text>';
 for(let d=-10;d<=120;d+=10){
  const y=py(d);
  s+='<line x1="'+X0+'" x2="'+X1+'" y1="'+y+'" y2="'+y+'" stroke="'+(d===20?'#9fb0bc':'#dde4e9')+'"/>';
  s+='<text x="'+(X0-8)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="#44545f">'+d+'</text>';
 }
 F.forEach((f,i)=>{
  const x=px(i);
  s+='<line x1="'+x+'" x2="'+x+'" y1="'+Y0+'" y2="'+Y1+'" stroke="#dde4e9"/>';
  s+='<text x="'+x+'" y="'+(Y0-10)+'" font-size="11" text-anchor="middle" fill="#44545f">'+f+'</text>';
 });
 s+='<text x="'+((X0+X1)/2)+'" y="'+(Y0-30)+'" font-size="11" text-anchor="middle" fill="#5d6f7c">Frecuencia (Hz)</text>';
 s+='<text transform="translate(16 '+((Y0+Y1)/2)+') rotate(-90)" font-size="11" text-anchor="middle" fill="#5d6f7c">Umbral (dB HL)</text>';
 ['aod','aoi'].forEach(k=>{
  const pts=[];D[k].forEach((v,i)=>{if(v!=null)pts.push([px(i),py(v)])});
  if(pts.length>1)s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+(k==='aod'?OD:OI)+'" stroke-width="1.6"/>';
 });
 const mkOn=document.getElementById('mk').checked;
 const nrOn=document.getElementById('nr').checked;
 K.forEach(k=>D[k].forEach((v,i)=>{if(v!=null)s+=sym(k,px(i),py(v),mkOn&&M[k][i])+(nrOn&&N[k][i]?arrow(k,px(i),py(v)):'')}));
 const L=[['aod','Aérea OD'],['aoi','Aérea OI'],['bod','Ósea OD'],['boi','Ósea OI']];
 L.forEach((l,j)=>{
  const x=96+j*136;
  s+=sym(l[0],x,425)+'<text x="'+(x+16)+'" y="429" font-size="12" fill="#1d2b36">'+l[1]+'</text>';
  if(mkOn)s+=sym(l[0],x,452,true)+'<text x="'+(x+16)+'" y="456" font-size="12" fill="#1d2b36">'+l[1]+' enmasc.</text>';
 });
 if(nrOn)s+='<text x="96" y="'+(mkOn?482:456)+'" font-size="12" fill="#1d2b36">Flecha hacia abajo: sin respuesta</text>';
 s+='</svg>';
 document.getElementById('chart').innerHTML=s;
 const a1=[2,3,4],a2=[2,3,4,6];
 a1od.textContent=avg('aod',a1);a1oi.textContent=avg('aoi',a1);
 a2od.textContent=avg('aod',a2);a2oi.textContent=avg('aoi',a2);
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.getElementById('png').onclick=()=>{
 const svg=document.getElementById('svg');
 const xml=new XMLSerializer().serializeToString(svg);
 const img=new Image();
 img.onload=()=>{
  const c=document.createElement('canvas');c.width=1280;c.height=980;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{
   const a=document.createElement('a');
   a.href=URL.createObjectURL(b);
   a.download='audiograma.png';
   document.body.appendChild(a);a.click();a.remove();
  });
 };
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
};
document.getElementById('prt').onclick=()=>window.print();
document.getElementById('clr').onclick=()=>{
 if(!confirm('¿Borrar todos los datos?'))return;
 K.forEach(k=>D[k]=[]);
 document.querySelectorAll('#rows input').forEach(i=>i.value='');
 K.forEach(k=>{M[k]=[];N[k]=[]});
 document.querySelectorAll('.m,.n').forEach(b=>b.setAttribute('aria-pressed','false'));
 document.getElementById('obs').value='';
 draw();
};
draw();
</script>
</body>
</html>
